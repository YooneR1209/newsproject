# El navegador solo habla con este Nginx; /api y /ws se reenvían al gateway.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con la dirección en una variable, Nginx resuelve
    # "gateway" en cada petición y no al arrancar: así el frontend levanta
    # aunque el gateway esté detenido, y lo encuentra cuando vuelve.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;

    location /api/ {
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Si el gateway no responde, el frontend muestra un error claro en vez de colgarse.
    error_page 502 503 504 = @gateway_down;
    location @gateway_down {
        default_type application/json;
        return 503 '{"error": "gateway no disponible"}';
    }

    # SPA: cualquier otra ruta carga index.html
    location / {
        try_files $uri /index.html;
    }
}
