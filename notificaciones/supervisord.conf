; PostgreSQL solo escucha dentro del contenedor (localhost).
[program:db]
command=docker-entrypoint.sh postgres -c listen_addresses=localhost
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; El backend debe reintentar la conexión a la BD y a RabbitMQ al arrancar.
[program:api]
command=/opt/java/openjdk/bin/java -jar /app/notificaciones.jar --server.port=8080
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
