; MongoDB solo escucha dentro del contenedor (127.0.0.1).
[program:db]
command=docker-entrypoint.sh mongod --bind_ip 127.0.0.1
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; El backend debe reintentar la conexión a la BD y a RabbitMQ al arrancar.
[program:api]
command=/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
